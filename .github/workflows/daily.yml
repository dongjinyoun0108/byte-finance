name: Daily carousel + reel

on:
  schedule:
    # 6:50am Sydney every day (waits until 7:30). Two UTC times cover daylight saving (AEDT/AEST);
    # the script ignores the run that lands outside 6-11am and posts only once per day.
    # Tue-Sat: market news (after each US session). Sun + Mon: "Money explained" lesson.
    # GitHub can start scheduled runs late or skip them under load, so there are several start times. The first
    # to start waits for 7:25; the others see posted.json (or queue behind it) and exit.
    - cron: '5 19 * * *'
    - cron: '35 19 * * *'
    - cron: '5 20 * * *'
    - cron: '35 20 * * *'
    - cron: '50 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = the normal scheduled run (waits for 7:25, posts once), dry = render only, preview = render + save reel to previews/, reeltest = render + upload reel without publishing, check = test Instagram login, force = post right now'
        type: choice
        options: [dry, preview, reeltest, check, force, auto]
        default: dry
      format:
        description: 'which post to make (auto = market news Tue-Sat, lesson Sun/Mon)'
        type: choice
        options: [auto, weekday, weekend]
        default: auto

permissions:
  contents: write

concurrency:
  group: daily-carousel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: ffmpeg (Reel render)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Run
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAUSED: ${{ vars.PAUSED }}
          REELS: ${{ vars.REELS }}
          REEL_MUSIC: ${{ vars.REEL_MUSIC }}
          REEL_LESSON_MUSIC: ${{ vars.REEL_LESSON_MUSIC }}
        run: |
          if [ "$PAUSED" = "true" ]; then echo "Paused"; exit 0; fi
          node scripts/daily.js ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'auto' && format('--{0}', inputs.mode) || '' }} ${{ github.event_name == 'workflow_dispatch' && inputs.format != 'auto' && format('--{0}', inputs.format) || '' }}
      - name: Keep dry-run slides
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry'
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: out/
